version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sporty_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sporty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      POSTGRES_DB: ${DB_NAME:-sporty_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sporty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sporty_network

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: sporty_auth_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sporty-jwt-refresh-secret-change-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:23007/auth/callback}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@sporty.cl}
      APP_PORT: 23001
    ports:
      - "23001:23001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  reservas-service:
    build:
      context: ./backend/reservas-service
      dockerfile: Dockerfile
    container_name: sporty_reservas_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:23001
      APP_PORT: 23002
    ports:
      - "23002:23002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  pagos-service:
    build:
      context: ./backend/pagos-service
      dockerfile: Dockerfile
    container_name: sporty_pagos_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:23001
      WEBPAY_COMMERCE_CODE: ${WEBPAY_COMMERCE_CODE:-}
      WEBPAY_API_KEY: ${WEBPAY_API_KEY:-}
      WEBPAY_RETURN_URL: ${WEBPAY_RETURN_URL:-http://localhost:23007/pagos/return}
      WEBPAY_CALLBACK_URL: ${WEBPAY_CALLBACK_URL:-http://localhost:23007/pagos/callback}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      APP_PORT: 23003
    ports:
      - "23003:23003"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  sedes-service:
    build:
      context: ./backend/sedes-service
      dockerfile: Dockerfile
    container_name: sporty_sedes_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:23001
      APP_PORT: 23004
    ports:
      - "23004:23004"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  clases-service:
    build:
      context: ./backend/clases-service
      dockerfile: Dockerfile
    container_name: sporty_clases_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:23001
      APP_PORT: 23005
    ports:
      - "23005:23005"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: sporty_admin_service
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-sporty}
      DB_PASSWORD: ${DB_PASSWORD:-sporty_secret}
      DB_NAME: ${DB_NAME:-sporty_db}
      JWT_SECRET: ${JWT_SECRET:-sporty-jwt-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:23001
      APP_PORT: 23006
    ports:
      - "23006:23006"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:23006/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sporty_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sporty_frontend
    ports:
      - "23007:80"
    depends_on:
      - auth-service
      - reservas-service
      - pagos-service
      - sedes-service
      - clases-service
      - admin-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sporty_network

networks:
  sporty_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local